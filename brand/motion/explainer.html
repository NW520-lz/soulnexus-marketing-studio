<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f1efe9;
        --ink: #16130f;
        --accent: #0a9fba;
        --mute: #8a8478;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }
      #hookvid {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      #hook {
        position: absolute;
        inset: 0;
        z-index: 30;
      }
      #paperwrap {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      #paper {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image: radial-gradient(#d8d4c9 1.4px, transparent 1.7px);
        background-size: 38px 38px;
      }
      .tag {
        position: absolute;
        left: 70px;
        top: 190px;
        z-index: 5;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.02em;
        color: var(--mute);
      }
      #caps {
        position: absolute;
        inset: 0;
        z-index: 25;
      }
      .cg {
        position: absolute;
        left: 70px;
        top: 270px;
        width: 940px;
        font-weight: 700;
        font-size: 76px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--ink);
        opacity: 0;
      }
      .cg .acc {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-weight: 700;
        color: var(--accent);
      }
      .card {
        position: absolute;
        left: 90px;
        top: 640px;
        width: 900px;
        z-index: 6;
        border-radius: 30px;
        overflow: hidden;
        background: #1c1917;
        box-shadow: 0 34px 60px rgba(40, 30, 10, 0.22), 0 8px 16px rgba(40, 30, 10, 0.16);
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
      }
      .card.sheet {
        top: 700px;
        padding: 14px;
        background: #ffffff;
        border-radius: 14px;
      }
      .card.sheet img {
        border-radius: 6px;
      }
      .badge {
        position: absolute;
        left: 906px;
        top: 596px;
        z-index: 8;
        width: 108px;
        height: 108px;
        border-radius: 26px;
        background: var(--ink);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 64px;
        box-shadow: 0 14px 28px rgba(40, 30, 10, 0.3);
      }
      #pipwrap {
        position: absolute;
        right: 14px;
        bottom: -26px;
        width: 340px;
        z-index: 16;
      }
      #pip {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 18px 18px rgba(40, 30, 10, 0.28));
      }
      #phone-frame {
        position: absolute;
        left: 220px;
        top: 600px;
        width: 640px;
        height: 1136px;
        z-index: 7;
        border-radius: 70px;
        background: #0e0c0a;
        box-shadow: 0 40px 70px rgba(40, 30, 10, 0.3), 0 10px 20px rgba(40, 30, 10, 0.2);
      }
      #clipvid {
        position: absolute;
        left: 236px;
        top: 616px;
        width: 608px;
        height: 1080px;
        z-index: 8;
        border-radius: 56px;
        object-fit: cover;
        background: #000;
      }
      #cta {
        position: absolute;
        inset: 0;
        z-index: 15;
      }
      #cta-bg {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image: radial-gradient(#d8d4c9 1.4px, transparent 1.7px);
        background-size: 38px 38px;
      }
      #cta-body {
        position: absolute;
        left: 0;
        top: 640px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        text-align: center;
        padding: 0 90px;
      }
      #cta-logo {
        width: 230px;
        height: 230px;
        border-radius: 54px;
        box-shadow: 0 20px 40px rgba(40, 30, 10, 0.25);
      }
      #cta-title {
        font-weight: 800;
        font-size: 92px;
        line-height: 1.05;
        color: var(--ink);
      }
      #cta-sub {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 54px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
__ELEMENTS__
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
__TIMELINE__
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
