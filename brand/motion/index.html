<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --brand: #00d9fc;
        --ink: #ffffff;
        --deep: #001018;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", sans-serif;
      }
      #base {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      #captions {
        position: absolute;
        inset: 0;
        z-index: 10;
      }
      #hook {
        position: absolute;
        inset: 0;
        z-index: 20;
      }
      #cta {
        position: absolute;
        inset: 0;
        z-index: 30;
      }
      #cta-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 8, 14, 0.84);
      }
      #cta-body {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        padding: 0 90px;
        text-align: center;
      }
      #cta-logo {
        width: 260px;
        height: 260px;
        border-radius: 60px;
        box-shadow: 0 20px 50px rgba(0, 217, 252, 0.28);
      }
      #cta-title {
        font-weight: 800;
        font-size: 92px;
        line-height: 1.05;
        color: var(--ink);
      }
      #cta-sub {
        font-weight: 800;
        font-size: 58px;
        color: var(--brand);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="base"
        class="clip"
        src="assets/base.mp4"
        playsinline
        data-start="0"
        data-duration="__DURATION__"
        data-track-index="0"
        data-has-audio="true"
      ></video>
      __CAPTIONS_HOST__
      __HOOK_HOST__
      <div id="cta" class="clip" data-start="__CTA_START__" data-duration="__CTA_DURATION__" data-track-index="3">
        <div id="cta-backdrop"></div>
        <div id="cta-body">
          <img id="cta-logo" src="assets/logo.png" alt="" />
          <div id="cta-title">__CTA_TITLE__</div>
          <div id="cta-sub">__CTA_SUB__</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const ctaStart = __CTA_START__;
      tl.fromTo("#cta-backdrop", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, ctaStart);
      tl.fromTo("#cta-logo", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, ctaStart + 0.1);
      tl.fromTo(["#cta-title", "#cta-sub"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.12, ease: "power3.out" }, ctaStart + 0.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
